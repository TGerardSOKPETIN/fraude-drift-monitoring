# Parametres du pipeline d'entrainement (cf. dvc.yaml, stage "train").
# Verser ici plutot que coder en dur dans train.py permet a DVC de detecter
# un changement de parametre et de proposer un re-entrainement (dvc repro),
# et de le faire figurer dans dvc.lock comme partie de la version du modele.
train:
  random_state: 42
  # Grille d'hyperparametres LightGBM (champion) : la meilleure configuration
  # sur le jeu de validation interne est retenue puis reentrainee (cf. train.py).
  param_grid:
    - {num_leaves: 31, learning_rate: 0.05, n_estimators: 800, min_child_samples: 20}
    - {num_leaves: 63, learning_rate: 0.03, n_estimators: 1200, min_child_samples: 30}
    - {num_leaves: 15, learning_rate: 0.08, n_estimators: 600, min_child_samples: 15}
